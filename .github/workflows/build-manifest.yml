name: Build MOGRT manifest

on:
  push:
    branches: [main, master]
    paths:
      - "templates/**"
      - "thumbnails/**"
      - "previews/**"
      - "scripts/build-manifest.js"
      - ".github/workflows/build-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/build-manifest.js

      - name: Verify scrub frames
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const need = 16;
            let failed = false;
            for (const t of m.templates || []) {
              const framesDir = path.join("previews", t.id, "frames");
              const n = fs.existsSync(framesDir)
                ? fs.readdirSync(framesDir).filter((f) => f.endsWith(".png")).length
                : 0;
              const urls = Array.isArray(t.frames) ? t.frames.length : 0;
              if (n < need || urls < need) {
                console.error(t.id + ": frames on disk=" + n + " manifest urls=" + urls);
                failed = true;
              } else {
                console.log(t.id + ": ok (" + n + " frames)");
              }
            }
            if (failed) process.exit(1);
          '

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json .versions.json
          if git diff --staged --quiet; then
            echo "No manifest changes"
          else
            git commit -m "chore: regenerate library manifest"
            git push
          fi
